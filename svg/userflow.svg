7"/><text x="1185" y="245.875" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="1185" dy="0">Системный диалог</tspan><tspan x="1185" dy="16.25">«Открыть файл»</tspan></text><rect x="1297" y="151" width="176" height="58" rx="8" fill="#4F46E5"/><text x="1385" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="1385" dy="0">Редактор</tspan></text><path d="M1385,380 L1469,430 L1385,480 L1301,430 z" fill="#fff" stroke="#4F46E5" stroke-width="2"/><text x="1385" y="419.1875" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F2329" text-anchor="middle"><tspan x="1385" dy="0">Результат</tspan><tspan x="1385" dy="15.625">устраивает?</tspan></text><rect x="1062" y="401" width="176" height="58" rx="8" fill="#4F46E5"/><text x="1150" y="425.875" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="1150" dy="0">Диалог</tspan><tspan x="1150" dy="16.25">«Экспорт»</tspan></text><rect x="832" y="401" width="176" height="58" rx="8" fill="#4F46E5"/><text x="920" y="425.875" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="920" dy="0">Системный диалог</tspan><tspan x="920" dy="16.25">«Сохранить как»</tspan></text><path d="M700,380 L784,430 L700,480 L616,430 z" fill="#fff" stroke="#4F46E5" stroke-width="2"/><text x="700" y="419.1875" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F2329" text-anchor="middle"><tspan x="700" dy="0">Файл</tspan><tspan x="700" dy="15.625">записан?</tspan></text><rect x="392" y="401" width="176" height="58" rx="8" fill="#4F46E5"/><text x="480" y="425.875" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="480" dy="0">Уведомление</tspan><tspan x="480" dy="16.25">«Файл сохранён»</tspan></text><circle cx="270" cy="430" r="30" fill="#4F46E5"/><circle cx="270" cy="430" r="35" fill="none" stroke="#4F46E5" stroke-width="2"/><text x="270" y="435" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="270" dy="0">Цель</tspan></text><text x="270" y="488" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#4F46E5" text-anchor="middle"><tspan x="270" dy="0">PNG-файл</tspan><tspan x="270" dy="15.625">на диске</tspan></text><rect x="30" y="550" width="1500" height="62" rx="8" fill="#F6F7F9" stroke="#DADDE3" stroke-width="1"/><text x="50" y="585" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2329" text-anchor="start"><tspan x="50" dy="0">Легенда:</tspan></text><circle cx="150" cy="580" r="14" fill="#fff" stroke="#1F2329" stroke-width="2"/><text x="172" y="585" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F2329" text-anchor="start"><tspan x="172" dy="0">точка входа</tspan></text><circle cx="290" cy="580" r="14" fill="#1F2329"/><text x="312" y="585" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F2329" text-anchor="start"><tspan x="312" dy="0">цель (конец)</tspan></text><rect x="420" y="566" width="46" height="28" rx="5" fill="#3A3F47"/><text x="476" y="585" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F2329" text-anchor="start"><tspan x="476" dy="0">экран / окно</tspan></text><path d="M600,564 L626,580 L600,596 L574,580 z" fill="#fff" stroke="#1F2329" stroke-width="1.6"/><text x="636" y="585" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F2329" text-anchor="start"><tspan x="636" dy="0">развилка (решение)</tspan></text><line x1="790" y1="580" x2="840" y2="580" stroke="#8A919E" stroke-width="1.6" marker-end="url(#arrG)