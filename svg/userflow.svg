<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 630" width="1560" height="630"><rect x="0" y="0" width="1560" height="630" rx="0" fill="#fff"/><defs>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A919E"/></marker></defs><text x="30" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2329" text-anchor="start"><tspan x="30" dy="0">User Flow: «Нарисовать открытку и сохранить её в PNG»</tspan></text><text x="30" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5C6370" text-anchor="start"><tspan x="30" dy="0">Персона: Аня (без аккаунта). Точка входа — запуск программы, цель — PNG-файл на диске. Основной путь — 8 переходов.</tspan></text><polyline points="90,180 117,180" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrA)" stroke-linejoin="round"/><polyline points="293,180 311,180" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrA)" stroke-linejoin="round"/><polyline points="395,130 395,105 502,105" fill="none" stroke="#8A919E" stroke-width="1.6" marker-end="url(#arrG)" stroke-linejoin="round"/><text x="448.5" y="96" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6370" text-anchor="middle"><tspan x="448.5" dy="0">Да</tspan></text><polyline points="678,105 790,105 790,151" fill="none" stroke="#8A919E" stroke-width="1.6" marker-end="url(#arrG)" stroke-linejoin="round"/><text x="734" y="96" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6370" text-anchor="middle"><tspan x="734" dy="0">вход выполнен</tspan></text><polyline points="479,180 702,180" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrA)" stroke-linejoin="round"/><text x="590.5" y="198" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="middle"><tspan x="590.5" dy="0">Нет · «Продолжить без входа»</tspan></text><polyline points="878,180 901,180" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrA)" stroke-linejoin="round"/><polyline points="985,130 985,110 1097,110" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrA)" stroke-linejoin="round"/><text x="1041" y="101" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="middle"><tspan x="1041" dy="0">«Создать»</tspan></text><polyline points="985,230 985,250 1097,250" fill="none" stroke="#8A919E" stroke-width="1.6" marker-end="url(#arrG)" stroke-linejoin="round"/><text x="1041" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6370" text-anchor="middle"><tspan x="1041" dy="0">«Открыть»</tspan></text><polyline points="1273,110 1385,110 1385,151" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrA)" stroke-linejoin="round"/><text x="1329" y="101" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="middle"><tspan x="1329" dy="0">размер, фон</tspan></text><polyline points="1273,250 1440,250 1440,209" fill="none" stroke="#8A919E" stroke-width="1.6" marker-end="url(#arrG)" stroke-linejoin="round"/><text x="1356.5" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6370" text-anchor="middle"><tspan x="1356.5" dy="0">выбран файл</tspan></text><polyline points="1385,209 1385,380" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrA)" stroke-linejoin="round"/><text x="1373" y="287" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="end"><tspan x="1373" dy="0">инструмент, цвет,</tspan><tspan x="1373" dy="15">рисование</tspan></text><polyline points="1469,430 1510,430 1510,180 1473,180" fill="none" stroke="#8A919E" stroke-width="1.6" marker-end="url(#arrG)" stroke-linejoin="round"/><text x="1502" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6370" text-anchor="end"><tspan x="1502" dy="0">Нет ·</tspan><tspan x="1502" dy="15">Ctrl+Z,</tspan><tspan x="1502" dy="15">дорисовать</tspan></text><polyline points="1301,430 1238,430" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrA)" stroke-linejoin="round"/><text x="1269.5" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="middle"><tspan x="1269.5" dy="0">Да</tspan></text><polyline points="1062,430 1008,430" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrA)" stroke-linejoin="round"/><text x="1035" y="400.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="middle"><tspan x="1035" dy="0">PNG,</tspan><tspan x="1035" dy="15">размер</tspan></text><polyline points="832,430 784,430" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrA)" stroke-linejoin="round"/><text x="808" y="400.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="middle"><tspan x="808" dy="0">папка,</tspan><tspan x="808" dy="15">имя</tspan></text><polyline points="700,480 700,510 920,510 920,459" fill="none" stroke="#8A919E" stroke-width="1.6" marker-end="url(#arrG)" stroke-linejoin="round"/><text x="810" y="525" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6370" text-anchor="middle"><tspan x="810" dy="0">Нет · выбрать другую папку</tspan></text><polyline points="616,430 568,430" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrA)" stroke-linejoin="round"/><text x="592" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="middle"><tspan x="592" dy="0">Да</tspan></text><polyline points="392,430 306,430" fill="none" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrA)" stroke-linejoin="round"/><circle cx="60" cy="180" r="30" fill="#fff" stroke="#4F46E5" stroke-